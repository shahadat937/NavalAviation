<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <div class="row">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
          <ul class="breadcrumb breadcrumb-style ">
            <li class="breadcrumb-item">
              <h4 class="page-title">Personnel List</h4>
            </li>
            <li class="breadcrumb-item bcrumb-1">
              <a routerLink="/admin/dashboard/main"><i class="fas fa-home"></i></a>
            </li>
            <li class="breadcrumb-item bcrumb-2">
              <a href="#" onClick="return false;">Personnel </a>
            </li>
            <li class="breadcrumb-item active">All</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="body">
            
            <div class="row create-table db-tbl cls-rtn">
              <!-- <h3 class="text-center table-title">Spares Demand LIST</h3> -->
              <div class="materialTableHeader auto">
                <div class="row">
                  <!-- <div class="col-xl-10 col-lg-10 col-md-12 col-sm-12 mb-2">
                    <h3 class="p-list">Personnel List</h3>

                  <div class="col-xl-2 col-lg-2 col-md-2 col-sm-12 mb-2">

                </div>
                <div class="row">
                  <div class="col-xl-9 col-lg-9 col-md-9 col-sm-12 mb-2">
                    <form [formGroup]="PersonnelFilterForm" (ngSubmit)="onSubmit()">
                      <div class="row">
        
                        <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                          <mat-form-field class="example-full-width mb-3" appearance="outline">
                            <mat-label>Type of Employee </mat-label>
                            <mat-select formControlName="employeeTypeId" required >
                              <mat-option value="0">All</mat-option>
                              <mat-option  *ngFor="let dropdown of selectedDepartmentName" [value]="dropdown.value">
                                {{dropdown.text}}
                              </mat-option>
                            </mat-select>
                            <mat-error *ngIf="PersonnelFilterForm.get('employeeTypeId').hasError('required')">
                              Type of Employee  is Required!
                            </mat-error>
                          </mat-form-field>
                        </div>
                        
        
                        <!-- <div class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                          <mat-form-field class="example-full-width mb-3" appearance="outline">
                            <mat-label> Date</mat-label>
                            <input matInput [matDatepicker]="frompicker" formControlName="date">
                            <mat-datepicker-toggle matSuffix [for]="frompicker"></mat-datepicker-toggle>
                            <mat-datepicker #frompicker></mat-datepicker>
                          </mat-form-field>
                        </div> -->
                        <div class="col-xl-2 col-lg-2 col-md-2 col-sm-12 mb-2">
                          <button class="btn-space" [disabled]="!PersonnelFilterForm.valid " mat-raised-button
                            color="primary">Filter</button>
                            
                        </div>
                        <div class="col-xl-2 col-lg-2 col-md-2 col-sm-12 mb-2"></div>
                        <!-- <div class="col-xl-2 col-lg-2 col-md-2 col-sm-12 mb-2 back-s">
                          <button class="back" [routerLink]="['/admin/dashboard/main']" mat-raised-button> <mat-icon>keyboard_backspace</mat-icon> Back</button>
                        </div> -->
                      </div>
                      
                    </form>
                  
                    <!-- <h3 class="p-list">Personnel List</h3> -->
                  </div>
                  <div style="text-align: right;" class="col-xl-3 col-lg-3 col-md-3 col-sm-12 mb-2">
                    <button class="btn-space" mat-raised-button color="primary" (click)="printSingle()"><mat-icon class="col-white">print</mat-icon></button>
                    <button class="back" [routerLink]="['/admin/dashboard/personalstate-list']" mat-raised-button> <mat-icon>keyboard_backspace</mat-icon> Back</button>
                  </div>
                  <!-- <div class="col-xl-4 col-lg-4 col-md-12 col-sm-12 mb-2">
                    <ul class="header-buttons-left ml-0">
                      <li class="dropdown">
                        <input
                          placeholder="Search"
                          type="text"
                          [(ngModel)]="searchText"
                          #filter
                          class="browser-default search-field custom-search"
                          aria-label="Search box"
                        />
                      </li>
                      <li>
                        <div class="icon-button-demo m-l-10">
                          <button
                            mat-mini-fab
                            (click)="applyFilter(searchText)"
                            color="accent"
                          >
                            <mat-icon class="col-white">search</mat-icon>
                          </button>
                        </div>
                      </li>
                    </ul>
                  </div> -->
                </div>
              </div>
              <div class="container no-padding">
                <div id="print-routine">
                  <table class="table tbl-by-group db-li-s-in">
                    <thead>
                      <tr>
                        <th class="cl-nm-rnk"><h5>PNo</h5></th>
                        <th class="cl-mrk"><h5>Name</h5></th>
                        <th class="cl-mrk-rmrk"><h5>Rank</h5></th>
                        <th class="cl-mrk-rmrk"><h5>Type</h5></th>
                        <th class="cl-mrk-rmrk"><h5>Department</h5></th>
                        <th class="cl-mrk-rmrk"><h5>Mobile</h5></th>
                        <th class="cl-mrk-rmrk"><h5>Remarks</h5></th>
                        <!-- <th class="cl-mrk-rmrk"><h5>Expired Date</h5></th>
                        <th class="thbm"><h5>Barcode</h5></th> -->
                        
                      </tr>
                    </thead>
                    <tbody>
                      <ng-container>
                        <!-- <tr>
                          <td [attr.rowspan]="data.datas.length + 1">
                            {{ data.departmentName }}
                          </td>
                        </tr> -->
                        <tr *ngFor="let number of personalStateList">
                          <td>{{ number.pno }}</td>
                          <td class="left-align">{{ number.name }}</td>
                          <td>{{ number.rankName }}</td>
                          <td>{{ number.typeName }}</td>
                          <td>{{ number.deptName }}</td>
                          <td>{{ number.mobile }}</td>
                          <td>{{ number.tcRemarks }}</td>
                          <!-- <td>
                            <button title="Barcode"   class="btn-space custom barcode" (click)="getPopup(number.itemStorId)"><i class="fa fa-barcode"></i></button> 
                            
                          </td> -->
                        </tr>
                      </ng-container>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
